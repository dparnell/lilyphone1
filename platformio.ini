; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

; *******************************************************
boards_dir = boards
default_envs = T-Deck-Pro
src_dir = src

[env:T-Deck-Pro]

platform = espressif32@6.5.0
board = T-Deck-Pro
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; extra_scripts =  ./script/pos_extra_script.py

build_flags = 
    -DBOARD_HAS_PSRAM

    ; Enable UARDUINO_ USB_ CDC_ ON_ BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Enable UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ; -DARDUINO_USB_CDC_ON_BOOT=0

    -DDISABLE_ALL_LIBRARY_WARNINGS
    -Wnarrowing

    ; LVGL config
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_INCLUDE_SIMPLE
    -include include/lv_conf.h
    -DTINY_GSM_MODEM_SIM7672

    ; MeshCore drives RadioLib internals directly, which it expects to be
    ; reachable - this is how MeshCore builds RadioLib upstream.
    -DRADIOLIB_GODMODE=1
    -DRADIOLIB_STATIC_ONLY=1

    ; MeshCore: the radio pins and the region it expects to be told about
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DP_LORA_SCLK=36
    -DP_LORA_MISO=47
    -DP_LORA_MOSI=33
    -DP_LORA_NSS=3
    -DP_LORA_DIO_1=5
    -DP_LORA_RESET=4
    -DP_LORA_BUSY=6
    -DSX126X_DIO3_TCXO_VOLTAGE=1.8
    -DSX126X_CURRENT_LIMIT=140
    -DLORA_FREQ=915.0
    -DLORA_BW=250.0
    -DLORA_SF=10
    -DLORA_CR=5
    -DLORA_TX_POWER=22

    ;  -DLOG_PORT=Serial

    ; Debug output
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_DIAGNOSTIC_OUTPUT=1

lib_deps = 
    ; zinggjm/GxEPD2@1.5.5
    ; jgromes/RadioLib@6.4.2
    ; lewisxhe/SensorLib@^0.2.0
    ; mikalhart/TinyGPSPlus @ ^1.0.3
    ; vshymanskyy/TinyGSM@^0.11.7
    ; lvgl/lvgl @ ~8.3.9
    ; lewisxhe/XPowersLib @ ^0.3.0
    ; adafruit/Adafruit TCA8418 @ ^1.0.1
    ; adafruit/Adafruit BusIO @ ^1.14.4
    ; olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    ; adafruit/Adafruit GFX Library@^1.11.10
    ; esphome/ESP32-audioI2S#v3.0.12
    SPI
    Wire
    FS
    SPIFFS
    EEPROM
